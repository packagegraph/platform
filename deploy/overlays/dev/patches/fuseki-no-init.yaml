apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuseki
  namespace: packagegraph
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: load-tdb2
          image: ghcr.io/packagegraph/etl:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4 &&
              CONTENT_HASH=$(mc cat pgraph/${MINIO_BUCKET}/tdb2/latest) &&
              echo "Latest snapshot: ${CONTENT_HASH}" &&
              HASH_FILE="/data/.content-hash" &&
              if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$CONTENT_HASH" ]; then
                echo "TDB2 already loaded, skipping download."
              else
                echo "Downloading tdb2/${CONTENT_HASH}/tdb2.tar.gz..." &&
                mc cp "pgraph/${MINIO_BUCKET}/tdb2/${CONTENT_HASH}/tdb2.tar.gz" /tmp/tdb2.tar.gz &&
                rm -rf /data/tdb2 && mkdir -p /data/tdb2 &&
                tar -xzf /tmp/tdb2.tar.gz -C /data/ &&
                rm /tmp/tdb2.tar.gz &&
                echo "$CONTENT_HASH" > "$HASH_FILE"
              fi &&
              echo "TDB2 ready."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: tdb2-data
              mountPath: /data
      containers:
        - name: fuseki
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/packagegraph/fuseki:5.3.0
          imagePullPolicy: Always
          args:
            - --config
            - /fuseki/config.ttl
            - --port
            - "3030"
          ports:
            - containerPort: 3030
              name: http
          volumeMounts:
            - name: tdb2-data
              mountPath: /data
            - name: fuseki-run
              mountPath: /fuseki/run
            - name: fuseki-config
              mountPath: /fuseki/config.ttl
              subPath: config.ttl
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /$/ping
              port: 3030
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /$/ping
              port: 3030
            initialDelaySeconds: 15
            periodSeconds: 10
