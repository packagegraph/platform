apiVersion: batch/v1
kind: Job
metadata:
  name: etl-collect
  namespace: packagegraph
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          imagePullPolicy: Always
          env:
            - name: HOME
              value: /tmp
            - name: COLLECT_ARGS
              value: "--distribution stable --component main --arch binary-amd64 --no-parallel"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
