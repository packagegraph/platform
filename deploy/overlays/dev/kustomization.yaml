apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - jobs/collect-debian-trixie.yaml
  - jobs/collect-fedora-43.yaml
  - jobs/collect-fedora-rawhide.yaml
  - jobs/collect-centos-stream-9.yaml
  - jobs/collect-centos-stream-10.yaml
  - jobs/collect-opensuse-tw.yaml
  - jobs/collect-alpine-v320.yaml
  - jobs/collect-homebrew.yaml
  - jobs/collect-arch.yaml
  - jobs/collect-npm.yaml
  - jobs/collect-pypi.yaml
  - jobs/collect-cargo.yaml
  - jobs/collect-gomod.yaml
  - jobs/collect-conda.yaml
  - jobs/collect-flatpak.yaml
  - jobs/collect-snap.yaml
  - jobs/collect-gentoo.yaml
  - jobs/collect-void.yaml
  - jobs/collect-osv.yaml
  - jobs/collect-rubygems.yaml
  - jobs/collect-maven.yaml
  - jobs/collect-cpan.yaml
  - jobs/collect-cran.yaml
  - jobs/collect-hackage.yaml
  - jobs/snapshot-tdb2.yaml
  - jobs/enrich-github-vcs.yaml
  - jobs/enrich-license.yaml
  - jobs/enrich-metrics.yaml
  - jobs/enrich-vcs-activity.yaml
  - jobs/enrich-security-system.yaml
  - jobs/enrich-security-lang.yaml
  - jobs/enrich-advisory.yaml
  - jobs/enrich-npm-provenance.yaml
  - jobs/enrich-koji.yaml
  - jobs/validate-data.yaml

patches:
  - path: patches/fuseki-resources.yaml
  - path: patches/fuseki-no-init.yaml
  - target:
      kind: Deployment
      name: fuseki
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: fuseki-run
          emptyDir: {}
