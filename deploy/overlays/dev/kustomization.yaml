apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Consolidated -full collectors (replace per-arch jobs with richer multi-arch + enrichment)
  - jobs/collect-fedora-43-full.yaml
  # collect-fedora-43.yaml, collect-fedora-43-aarch64.yaml — superseded by fedora-43-full (multi-arch + koji + spec)
  - jobs/collect-fedora-44.yaml
  - jobs/collect-fedora-riscv64.yaml
  - jobs/collect-debian-trixie-full.yaml
  # collect-debian-trixie.yaml, collect-debian-trixie-arm64.yaml — superseded by debian-trixie-full (multi-arch + sources + salsa)
  - jobs/collect-debian-sid-riscv64.yaml
  - jobs/collect-ubuntu-noble.yaml
  - jobs/collect-ubuntu-noble-arm64.yaml
  - jobs/collect-ubuntu-noble-riscv64.yaml
  - jobs/collect-centos-stream-9-full.yaml
  # collect-centos-stream-9.yaml, collect-centos-stream-9-aarch64.yaml — superseded by centos-stream-9-full (multi-arch + spec)
  - jobs/collect-centos-stream-10.yaml
  - jobs/collect-centos-stream-10-aarch64.yaml
  - jobs/collect-opensuse-tw.yaml
  - jobs/collect-opensuse-tw-aarch64.yaml
  - jobs/collect-opensuse-tw-riscv64.yaml
  - jobs/collect-alpine-v320.yaml
  - jobs/collect-alpine-v320-aarch64.yaml
  - jobs/collect-alpine-edge-riscv64.yaml
  - jobs/collect-homebrew.yaml
  - jobs/collect-arch.yaml
  - jobs/collect-archarm-aarch64.yaml
  - jobs/collect-npm.yaml
  - jobs/collect-pypi.yaml
  - jobs/collect-cargo.yaml
  - jobs/collect-gomod.yaml
  - jobs/collect-conda.yaml
  - jobs/collect-flatpak.yaml
  - jobs/collect-snap.yaml
  - jobs/collect-gentoo.yaml
  - jobs/collect-void.yaml
  - jobs/collect-osv.yaml
  - jobs/collect-rubygems.yaml
  - jobs/collect-maven.yaml
  - jobs/collect-cpan.yaml
  - jobs/collect-cran.yaml
  - jobs/collect-hackage.yaml
  - jobs/collect-nuget.yaml
  - jobs/collect-hex.yaml
  - jobs/collect-freebsd.yaml
  - jobs/collect-nix.yaml
  - jobs/collect-chocolatey.yaml
  - jobs/collect-openwrt-2410-full.yaml
  - jobs/rebuild-tdb2.yaml
  - rbac/rebuild-tdb2-rbac.yaml
  - jobs/rebuild-qlever-index.yaml
  - rbac/rebuild-qlever-rbac.yaml
  - jobs/enrich-github.yaml
  # enrich-security-system and enrich-security-lang REMOVED — replaced by collect-osv.yaml
  # The old enrichers hit api.osv.dev per-package (68K+ API calls per ecosystem).
  # collect-osv-* downloads bulk data from gs://osv-vulnerabilities instead.
  - jobs/enrich-advisory.yaml
  - jobs/enrich-npm-provenance.yaml
  - jobs/enrich-koji.yaml
  - jobs/enrich-repology.yaml
  - jobs/validate-data.yaml

images:
  - name: ghcr.io/packagegraph/etl
    newTag: v0.12.0
  - name: ghcr.io/packagegraph/qlever-rebuild
    newTag: v0.12.0

patches:
  - path: patches/fuseki-resources.yaml
  - path: patches/fuseki-no-init.yaml
  - target:
      kind: Deployment
      name: fuseki
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: fuseki-run
          emptyDir: {}
