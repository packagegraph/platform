apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-fedora-rawhide-aarch64
  namespace: packagegraph
spec:
  schedule: "0 5 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/fedora/rawhide/aarch64"}
                - {name: RPM_REPOS, value: "fedora:rawhide:https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Everything/aarch64/os/"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
