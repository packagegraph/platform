apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-pypi
  namespace: packagegraph
spec:
  schedule: "0 9 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/pypi"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  CACHE_DIR=/tmp/cache/pypi
                  MINIO_CACHE="pgraph/${MINIO_BUCKET}/collector-cache/pypi"

                  # Initialize Minio alias
                  mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

                  # Warm cache
                  mkdir -p "${CACHE_DIR}"
                  if mc ls "${MINIO_CACHE}/" >/dev/null 2>&1; then
                    echo "Syncing cache from Minio..."
                    mc mirror --overwrite "${MINIO_CACHE}/" "${CACHE_DIR}/" || echo "Cache warm failed, continuing without cache"
                  fi

                  # Run collector with cache
                  pg-collect pypi \
                    --endpoint "$FUSEKI_ENDPOINT" \
                    --cache-dir "${CACHE_DIR}" \
                    --cache-ttl-hours 24 \
                    -o /tmp/pypi.nt

                  COLLECT_EXIT=$?

                  # Save cache only on success
                  if [ $COLLECT_EXIT -eq 0 ]; then
                    echo "Syncing cache to Minio..."
                    mc mirror --overwrite --exclude "*.tmp" --exclude "*.lock" "${CACHE_DIR}/" "${MINIO_CACHE}/" || echo "Cache save failed"
                  fi

                  # Upload only on success
                  if [ $COLLECT_EXIT -eq 0 ]; then
                    /app/scripts/upload-nt.sh /tmp/pypi.nt "$GRAPH_URI"
                    exit $?
                  fi

                  exit $COLLECT_EXIT
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "1", memory: 2Gi}}
