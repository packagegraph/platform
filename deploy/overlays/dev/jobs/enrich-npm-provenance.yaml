apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrich-npm-provenance
  namespace: packagegraph
spec:
  schedule: "0 10 * * 1"  # Weekly on Monday at 10am (after npm collector)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: enricher
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              env:
                - {name: HOME, value: /tmp}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
              envFrom:
                - secretRef: {name: minio-credentials}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mkdir -p /tmp/enrichment
                  GRAPH_URI="https://packagegraph.github.io/graph/enrichment/npm-provenance"
                  mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

                  if pg-collect enrich-npm-provenance \
                    --endpoint "$FUSEKI_ENDPOINT" \
                    -o /tmp/enrichment/npm_provenance.nt && \
                  pg-collect drop --graph "$GRAPH_URI" --endpoint "$FUSEKI_ENDPOINT" && \
                  pg-collect load /tmp/enrichment/npm_provenance.nt \
                    --graph "$GRAPH_URI" --endpoint "$FUSEKI_ENDPOINT"; then
                    /app/scripts/upload-nt.sh /tmp/enrichment/npm_provenance.nt "$GRAPH_URI"
                  else
                    echo "ERROR: npm-provenance enrichment or load failed — skipping Minio upload"
                    rm -f /tmp/enrichment/npm_provenance.nt
                    exit 1
                  fi
              resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
