apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-cargo
  namespace: packagegraph
spec:
  schedule: "0 10 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/cargo"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  packagegraph seed-cargo \
                    --fuseki-endpoint "$FUSEKI_ENDPOINT" \
                    --from-names \
                    -o /tmp/seed-cargo.txt && \
                  pg-collect cargo \
                    --packages-file /tmp/seed-cargo.txt \
                    -o /tmp/packages.nt && \
                  pg-collect drop --graph "$GRAPH_URI" --endpoint "$FUSEKI_ENDPOINT" && \
                  pg-collect load /tmp/packages.nt --graph "$GRAPH_URI" --endpoint "$FUSEKI_ENDPOINT"
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "1", memory: 2Gi}}
