apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrich-repology
  namespace: packagegraph
spec:
  schedule: "0 11 * * 1"  # Weekly on Monday at 11am (after other enrichers)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: enricher
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mkdir -p /tmp/enrichment
                  CACHE_DIR=/tmp/cache/repology
                  MINIO_CACHE="pgraph/${MINIO_BUCKET}/enricher-cache/repology"
                  mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

                  if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                    echo "Syncing cache from Minio..."
                    mc mirror --overwrite "${MINIO_CACHE}/" "${CACHE_DIR}/" 2>/dev/null || true
                    echo "Cache warmed: $(find "${CACHE_DIR}" -name '*.json' 2>/dev/null | wc -l) entries"
                  fi

                  pg-collect enrich-repology \
                    --endpoint "$FUSEKI_ENDPOINT" \
                    -o /tmp/enrichment/repology.nt \
                    --cache-dir "${CACHE_DIR}" || true

                  if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                    echo "Syncing cache to Minio..."
                    mc mirror --overwrite "${CACHE_DIR}/" "${MINIO_CACHE}/" 2>/dev/null || true
                  fi

                  if [ -f /tmp/enrichment/repology.nt ]; then
                    pg-collect drop \
                      --graph "https://packagegraph.github.io/graph/enrichment/repology" \
                      --endpoint "$FUSEKI_ENDPOINT" && \
                    pg-collect load /tmp/enrichment/repology.nt \
                      --graph "https://packagegraph.github.io/graph/enrichment/repology" \
                      --endpoint "$FUSEKI_ENDPOINT"
                  fi
              resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
