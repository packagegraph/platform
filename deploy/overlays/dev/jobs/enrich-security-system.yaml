apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrich-security-system
  namespace: packagegraph
spec:
  schedule: "0 7 * * 1"  # Weekly on Monday at 7am (after collectors)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: enricher
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONUNBUFFERED, value: "1"}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

                  for ECOSYSTEM in debian alpine; do
                    echo "=== Security enrichment: $ECOSYSTEM ==="
                    CACHE_DIR="/tmp/cache/security/${ECOSYSTEM}"
                    MINIO_CACHE="pgraph/${MINIO_BUCKET}/enricher-cache/security/${ECOSYSTEM}"

                    if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                      echo "Syncing cache from Minio..."
                      mc mirror --overwrite "${MINIO_CACHE}/" "${CACHE_DIR}/" 2>/dev/null || true
                      echo "Cache warmed: $(find "${CACHE_DIR}" -name '*.json' 2>/dev/null | wc -l) entries"
                    fi

                    packagegraph enrich-security \
                      --fuseki-endpoint "$FUSEKI_ENDPOINT" \
                      --output-dir /tmp/enrichment \
                      --cache-dir "${CACHE_DIR}" \
                      --ecosystem "$ECOSYSTEM" || true

                    if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                      echo "Syncing cache to Minio..."
                      mc mirror --overwrite "${CACHE_DIR}/" "${MINIO_CACHE}/" 2>/dev/null || true
                    fi

                    if [ -f "/tmp/enrichment/security_${ECOSYSTEM}.nt" ]; then
                      pg-collect drop \
                        --graph "https://packagegraph.github.io/graph/enrichment/security-${ECOSYSTEM}" \
                        --endpoint "$FUSEKI_ENDPOINT" && \
                      pg-collect load "/tmp/enrichment/security_${ECOSYSTEM}.nt" \
                        --graph "https://packagegraph.github.io/graph/enrichment/security-${ECOSYSTEM}" \
                        --endpoint "$FUSEKI_ENDPOINT"
                    fi
                  done
              resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
