apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-arch
  namespace: packagegraph
spec:
  schedule: "0 6 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 3600  # AUR collection may take ~15 min
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/arch"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pg-collect arch \
                    --repo core --repo extra --repo multilib \
                    --include-aur \
                    -o /tmp/packages.nt && \
                  if [ "${COLLECTOR_FULL_RELOAD:-0}" = "1" ]; then
                    pg-collect drop --graph "$GRAPH_URI" --endpoint "$FUSEKI_ENDPOINT"
                  fi
                  pg-collect load /tmp/packages.nt \
                    --graph "$GRAPH_URI" \
                    --endpoint "$FUSEKI_ENDPOINT"
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
