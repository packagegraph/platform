apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-snap
  namespace: packagegraph
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONUNBUFFERED, value: "1"}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/snap"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  packagegraph seed-snap --output /tmp/snap-seed.txt && \
                  pg-collect snap \
                    --packages-file /tmp/snap-seed.txt \
                    --output /tmp/snap.nt && \
                  if [ "${COLLECTOR_FULL_RELOAD:-0}" = "1" ]; then
                    pg-collect drop --graph "$GRAPH_URI" --endpoint "$FUSEKI_ENDPOINT"
                  fi
                  pg-collect load /tmp/snap.nt --graph "$GRAPH_URI" --endpoint "$FUSEKI_ENDPOINT"
              resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
