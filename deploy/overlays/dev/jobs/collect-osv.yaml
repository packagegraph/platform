# OSV Security Vulnerability Collectors
# Downloads bulk vulnerability data from OSV GCS bucket for all supported ecosystems.
# All ecosystems load into a single shared graph: graph/security/osv

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-osv-npm
  namespace: packagegraph
spec:
  schedule: "0 9 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/security/osv"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pg-collect osv --ecosystem npm -o /tmp/osv-npm.nt && \
                  /app/scripts/upload-nt.sh /tmp/osv-npm.nt "$GRAPH_URI"
              resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 2Gi}}

