apiVersion: batch/v1
kind: CronJob
metadata:
  name: snapshot-tdb2
  namespace: packagegraph
spec:
  schedule: "0 12 * * 0"  # Weekly on Sunday at noon (after collectors finish)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: snapshot
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom:
                - secretRef: {name: minio-credentials}
              env:
                - {name: HOME, value: /tmp}
              volumeMounts:
                - name: tdb2-data
                  mountPath: /data
                  readOnly: true
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "=== TDB2 Snapshot ==="

                  # Content-hash the TDB2 directory
                  CONTENT_HASH=$(find /data/tdb2 -type f | sort | xargs sha256sum | sha256sum | cut -c1-16)
                  echo "Content hash: ${CONTENT_HASH}"

                  # Check if this snapshot already exists in Minio
                  mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4
                  EXISTING=$(mc cat "pgraph/${MINIO_BUCKET}/tdb2/latest" 2>/dev/null || echo "none")
                  if [ "$EXISTING" = "$CONTENT_HASH" ]; then
                    echo "Snapshot ${CONTENT_HASH} already archived, skipping."
                    exit 0
                  fi

                  # Create tarball
                  echo "Creating TDB2 archive..."
                  tar -czf /tmp/tdb2.tar.gz -C /data tdb2/
                  ARCHIVE_SIZE=$(du -h /tmp/tdb2.tar.gz | cut -f1)
                  echo "Archive size: ${ARCHIVE_SIZE}"

                  # Upload to Minio
                  echo "Uploading to pgraph/${MINIO_BUCKET}/tdb2/${CONTENT_HASH}/tdb2.tar.gz..."
                  mc cp /tmp/tdb2.tar.gz "pgraph/${MINIO_BUCKET}/tdb2/${CONTENT_HASH}/tdb2.tar.gz"
                  rm /tmp/tdb2.tar.gz

                  # Update latest pointer
                  echo "${CONTENT_HASH}" | mc pipe "pgraph/${MINIO_BUCKET}/tdb2/latest"
                  echo "=== Snapshot ${CONTENT_HASH} archived (${ARCHIVE_SIZE}) ==="
              resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 2Gi}}
          volumes:
            - name: tdb2-data
              persistentVolumeClaim:
                claimName: fuseki-tdb2
