apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-debian-sid-riscv64
  namespace: packagegraph
spec:
  schedule: "0 3 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/debian/sid/riscv64"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pg-collect debian --repo "http://deb.debian.org/debian-ports" --dist sid --component main --arch binary-riscv64 -o /tmp/packages.nt && /app/scripts/upload-nt.sh /tmp/packages.nt "$GRAPH_URI"
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
