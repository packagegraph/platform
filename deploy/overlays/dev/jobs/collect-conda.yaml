apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-conda
  namespace: packagegraph
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONUNBUFFERED, value: "1"}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/conda-forge"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pg-collect conda \
                    --channel-url https://conda.anaconda.org/conda-forge \
                    --subdir linux-64 \
                    --output /tmp/conda.nt && \
                  /app/scripts/upload-nt.sh /tmp/conda.nt "$GRAPH_URI"
              resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {cpu: "2", memory: 4Gi}}
