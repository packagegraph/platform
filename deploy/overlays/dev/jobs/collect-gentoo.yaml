apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-gentoo
  namespace: packagegraph
spec:
  schedule: "0 5 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONUNBUFFERED, value: "1"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "=== Downloading Gentoo repo tarball ==="
                  curl -fsSL https://github.com/gentoo/gentoo/archive/refs/heads/master.tar.gz \
                    -o /tmp/gentoo.tar.gz
                  echo "Extracting..."
                  mkdir -p /tmp/gentoo-repo
                  tar -xzf /tmp/gentoo.tar.gz -C /tmp/gentoo-repo --strip-components=1
                  rm /tmp/gentoo.tar.gz
                  echo "Repo extracted to /tmp/gentoo-repo"

                  pg-collect gentoo \
                    --repo-path /tmp/gentoo-repo \
                    --output /tmp/gentoo.nt && \
                  /app/scripts/upload-nt.sh /tmp/gentoo.nt "$GRAPH_URI"
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 4Gi}}
