apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrich-github-vcs
  namespace: packagegraph
spec:
  schedule: "0 3 * * 1"  # Weekly on Monday at 3am (before other enrichers)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: enricher
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom:
                - secretRef: {name: minio-credentials}
                - secretRef: {name: github-token}
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONUNBUFFERED, value: "1"}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  CACHE_DIR=/tmp/cache/github
                  MINIO_CACHE="pgraph/${MINIO_BUCKET}/enricher-cache/github"
                  mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

                  # Warm cache from Minio (unless disabled)
                  if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                    echo "Syncing cache from Minio..."
                    mc mirror --overwrite "${MINIO_CACHE}/" "${CACHE_DIR}/" 2>/dev/null || true
                    echo "Cache warmed: $(find "${CACHE_DIR}" -name '*.json' 2>/dev/null | wc -l) entries"
                  else
                    echo "Cache disabled (ENRICHER_CACHE_DISABLED=1)"
                  fi

                  # Run enricher (may exit non-zero on partial completion)
                  packagegraph enrich-github-vcs \
                    --fuseki-endpoint "$FUSEKI_ENDPOINT" \
                    --output-dir /tmp/enrichment \
                    --cache-dir "${CACHE_DIR}" || true

                  # Always sync cache back — even on partial runs
                  if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                    echo "Syncing cache to Minio..."
                    mc mirror --overwrite "${CACHE_DIR}/" "${MINIO_CACHE}/" 2>/dev/null || true
                    echo "Cache synced: $(find "${CACHE_DIR}" -name '*.json' 2>/dev/null | wc -l) entries"
                  fi

                  # Load triples if output exists
                  if [ -f /tmp/enrichment/github_vcs.nt ]; then
                    pg-collect drop \
                      --graph "https://packagegraph.github.io/graph/enrichment/github-vcs" \
                      --endpoint "$FUSEKI_ENDPOINT" && \
                    pg-collect load /tmp/enrichment/github_vcs.nt \
                      --graph "https://packagegraph.github.io/graph/enrichment/github-vcs" \
                      --endpoint "$FUSEKI_ENDPOINT"
                  fi
              resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
