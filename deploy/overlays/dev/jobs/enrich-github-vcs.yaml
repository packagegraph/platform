apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrich-github-vcs
  namespace: packagegraph
spec:
  schedule: "0 3 * * 1"  # Weekly on Monday at 3am (before other enrichers)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: enricher
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom:
                - secretRef: {name: minio-credentials}
                - secretRef: {name: github-token}
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONUNBUFFERED, value: "1"}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
                - {name: ENRICHER_FRESHNESS_DAYS, value: "7"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  CACHE_DIR=/tmp/cache/github
                  MINIO_CACHE="pgraph/${MINIO_BUCKET}/enricher-cache/github"
                  mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

                  # Warm cache from Minio tarball (unless disabled)
                  if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                    mkdir -p /tmp/cache
                    CACHE_TARBALL="${MINIO_CACHE}.tar.gz"
                    if mc stat "${CACHE_TARBALL}" >/dev/null 2>&1; then
                      echo "Downloading cache tarball..."
                      mc cat "${CACHE_TARBALL}" | tar xzf - -C /tmp/cache/
                      echo "Cache warmed: $(find "${CACHE_DIR}" -name '*.json' 2>/dev/null | wc -l) entries"
                    else
                      echo "No cache tarball found, starting fresh"
                    fi
                  else
                    echo "Cache disabled (ENRICHER_CACHE_DISABLED=1)"
                  fi

                  # Run enricher (may exit non-zero on partial completion)
                  packagegraph enrich-github-vcs \
                    --fuseki-endpoint "$FUSEKI_ENDPOINT" \
                    --output-dir /tmp/enrichment \
                    --cache-dir "${CACHE_DIR}" || true

                  # Archive cache back to Minio as tarball
                  if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                    CACHE_TARBALL="${MINIO_CACHE}.tar.gz"
                    CACHE_COUNT=$(find "${CACHE_DIR}" -name '*.json' 2>/dev/null | wc -l)
                    echo "Archiving ${CACHE_COUNT} cache entries to Minio..."
                    tar czf - -C "$(dirname "${CACHE_DIR}")" "$(basename "${CACHE_DIR}")" | mc pipe "${CACHE_TARBALL}" >/dev/null 2>&1 || true
                    echo "Cache archived: ${CACHE_COUNT} entries"
                  fi

                  # Incremental load — POST appends to existing graph (no DROP).
                  # Each repo has pkg:enrichedAt so stale data is identifiable.
                  # Use DROP only for full re-enrichment (ENRICHER_FRESHNESS_DAYS=0).
                  if [ -f /tmp/enrichment/github_vcs.nt ] && [ -s /tmp/enrichment/github_vcs.nt ]; then
                    if [ "${ENRICHER_FRESHNESS_DAYS:-7}" = "0" ]; then
                      echo "Full re-enrichment: dropping existing graph"
                      pg-collect drop \
                        --graph "https://packagegraph.github.io/graph/enrichment/github-vcs" \
                        --endpoint "$FUSEKI_ENDPOINT"
                    fi
                    pg-collect load /tmp/enrichment/github_vcs.nt \
                      --graph "https://packagegraph.github.io/graph/enrichment/github-vcs" \
                      --endpoint "$FUSEKI_ENDPOINT"
                  else
                    echo "No enrichment output to load"
                  fi
              resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: "1", memory: 2Gi}}
