apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-maven
  namespace: packagegraph
spec:
  schedule: "30 7 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 5400
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: minio-credentials}}]
              env:
                - {name: HOME, value: /tmp}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
                - {name: GRAPH_URI, value: "https://packagegraph.github.io/graph/maven"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  CACHE_DIR=/tmp/cache/maven
                  mkdir -p "${CACHE_DIR}"
                  MINIO_CACHE="pgraph/${MINIO_BUCKET:-}/collector-cache/maven"

                  # Remote cache operations are best-effort — collection must not depend on Minio
                  CACHE_AVAILABLE=false
                  if mc alias set pgraph "${MINIO_ENDPOINT:-}" "${MINIO_ACCESS_KEY:-}" "${MINIO_SECRET_KEY:-}" --api S3v4 2>/dev/null; then
                    CACHE_AVAILABLE=true
                    echo "Warming cache from Minio..."
                    mc mirror --overwrite "${MINIO_CACHE}/" "${CACHE_DIR}/" 2>/dev/null || echo "Cache warm failed, continuing"
                    echo "Cache warmed: $(find "${CACHE_DIR}" -type f 2>/dev/null | wc -l) entries"
                  else
                    echo "WARNING: Minio alias setup failed, proceeding without remote cache"
                  fi

                  # Curated roots from the mounted seed list, not SPARQL
                  # auto-discovery: discovery seeded from every package claiming
                  # a Maven upstream, 73.1% of which was never published to
                  # Maven Central, tripping the collector's error-rate guard.
                  # Kept in step with deploy/quadlet/collectors/scripts/maven.sh,
                  # which this job was ported to; both publish the same
                  # GRAPH_URI.
                  #
                  # The list is NOT in this repository and NOT in the image --
                  # it is a curated set from a private source, supplied here by
                  # the collector-seeds Secret created out of band. Fail loudly
                  # rather than publishing an empty graph over the real one.
                  SEED_FILE=/seeds/maven-roots.txt
                  if [ ! -s "$SEED_FILE" ]; then
                    echo "ERROR: $SEED_FILE missing or empty; refusing to run." >&2
                    echo "Create the collector-seeds Secret; see" >&2
                    echo "deploy/quadlet/collectors/seeds/README.md." >&2
                    exit 1
                  fi

                  pg-collect maven \
                    --packages-file "$SEED_FILE" \
                    --cache-dir "${CACHE_DIR}" \
                    -o /tmp/maven.nt
                  COLLECT_EXIT=$?

                  # Save cache only if Minio is available
                  if [ "$CACHE_AVAILABLE" = "true" ]; then
                    echo "Saving cache to Minio..."
                    mc mirror --overwrite --exclude "*.tmp" --exclude "*.lock" "${CACHE_DIR}/" "${MINIO_CACHE}/" 2>/dev/null || echo "Cache save failed"
                  fi

                  [ $COLLECT_EXIT -eq 0 ] && /app/scripts/upload-nt.sh /tmp/maven.nt "$GRAPH_URI"
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
              volumeMounts:
                - {name: seeds, mountPath: /seeds, readOnly: true}
          # Secret, not ConfigMap: the seed set is curated from a private source
          # and is deliberately absent from this repository. Create it out of
          # band, e.g.
          #   kubectl create secret generic collector-seeds \
          #     --from-file=maven-roots.txt=<path to the list>
          volumes:
            - {name: seeds, secret: {secretName: collector-seeds}}
