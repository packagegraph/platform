apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuseki
  namespace: packagegraph
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: load-tdb2
          image: ghcr.io/packagegraph/etl:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4
              MC_ERR=$(mktemp)
              CONTENT_HASH=""
              if CONTENT_HASH=$(mc cat "pgraph/${MINIO_BUCKET}/tdb2/latest" 2>"$MC_ERR"); then
                echo "Latest snapshot: ${CONTENT_HASH}"
              else
                ERR_MSG=$(cat "$MC_ERR")
                rm -f "$MC_ERR"
                if echo "$ERR_MSG" | grep -q "NoSuchKey\|Object does not exist"; then
                  echo "No tdb2/latest found in Minio — skipping snapshot load."
                  echo "TDB2 ready (empty or pre-existing data on PVC)."
                  exit 0
                fi
                echo "ERROR: Minio read failed: $ERR_MSG"
                exit 1
              fi
              rm -f "$MC_ERR"
              HASH_FILE="/data/.content-hash" &&
              # Recover from interrupted swap
              if [ ! -d /data/tdb2 ] && [ -d /data/tdb2.prev ]; then
                echo "Recovering from interrupted swap — restoring tdb2.prev"
                mv /data/tdb2.prev /data/tdb2
              fi
              rm -rf /data/tdb2.staging &&
              if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$CONTENT_HASH" ]; then
                echo "TDB2 already loaded, skipping download."
              else
                echo "Downloading tdb2/${CONTENT_HASH}/tdb2.tar.gz..." &&
                mc cp "pgraph/${MINIO_BUCKET}/tdb2/${CONTENT_HASH}/tdb2.tar.gz" /tmp/tdb2.tar.gz &&
                mkdir -p /data/tdb2.staging &&
                if ! tar -xzf /tmp/tdb2.tar.gz -C /data/tdb2.staging --strip-components=1; then
                  echo "ERROR: extraction failed — keeping current database"
                  rm -rf /data/tdb2.staging /tmp/tdb2.tar.gz
                  exit 1
                fi
                rm -f /tmp/tdb2.tar.gz &&
                # Atomic swap: old → .prev, staging → active
                [ -d /data/tdb2 ] && mv /data/tdb2 /data/tdb2.prev
                if ! mv /data/tdb2.staging /data/tdb2; then
                  echo "ERROR: swap failed — restoring previous"
                  [ -d /data/tdb2.prev ] && mv /data/tdb2.prev /data/tdb2
                  exit 1
                fi
                rm -rf /data/tdb2.prev &&
                rm -rf /data/text-index &&
                echo "$CONTENT_HASH" > "$HASH_FILE"
              fi &&
              echo "TDB2 ready."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: tdb2-data
              mountPath: /data
        - name: rebuild-text-index
          image: ghcr.io/packagegraph/fuseki:5.3.0
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              if [ -f /data/text-index/.complete ]; then
                echo "Lucene text index already built — skipping"
              elif [ -d /data/tdb2 ]; then
                rm -rf /data/text-index
                echo "Rebuilding Lucene text index from TDB2..."
                if ! /opt/java-minimal/bin/java ${JAVA_OPTIONS:-} \
                  -cp '/fuseki/jena-fuseki-fulljar-5.3.0.jar' jena.textindexer \
                  --desc=/fuseki/config.ttl 2>&1; then
                  echo "ERROR: text indexer failed — removing partial index"
                  rm -rf /data/text-index
                  exit 1
                fi
                touch /data/text-index/.complete
                echo "Text index rebuild complete"
              else
                echo "No TDB2 data — skipping text index"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: JAVA_OPTIONS
              value: "-Xmx2g"
          volumeMounts:
            - name: tdb2-data
              mountPath: /data
            - name: fuseki-config
              mountPath: /fuseki/config.ttl
              subPath: config.ttl
      containers:
        - name: fuseki
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/packagegraph/fuseki:5.3.0
          imagePullPolicy: Always
          args:
            - --config
            - /fuseki/config.ttl
            - --port
            - "3030"
          ports:
            - containerPort: 3030
              name: http
          volumeMounts:
            - name: tdb2-data
              mountPath: /data
            - name: fuseki-run
              mountPath: /fuseki/run
            - name: fuseki-config
              mountPath: /fuseki/config.ttl
              subPath: config.ttl
          # Resources set by fuseki-resources.yaml patch (6Gi limit)
          # JVM heap set by fuseki-resources.yaml patch (per-overlay)
          livenessProbe:
            httpGet:
              path: /$/ping
              port: 3030
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /$/ping
              port: 3030
            initialDelaySeconds: 15
            periodSeconds: 10
