apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuseki
  namespace: packagegraph
spec:
  template:
    spec:
      containers:
        - name: fuseki
          env:
            - name: JAVA_OPTIONS
              # TDB2 memory-mapped files need OS cache space.
              # 4Gi container → 1.5Gi JVM + 2.5Gi OS cache.
              value: "-Xmx1536m"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
