apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrich-github
  namespace: packagegraph
spec:
  schedule: "0 0 * * 1"  # Weekly on Monday at midnight (finishes before QLever rebuild at 03:30)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: enricher
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: IfNotPresent
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom:
                - secretRef: {name: minio-credentials}
                - secretRef: {name: github-token}
              env:
                - {name: HOME, value: /tmp}
                - {name: FUSEKI_ENDPOINT, value: "http://fuseki.packagegraph.svc:3030/packagegraph"}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mkdir -p /tmp/enrichment
                  CACHE_DIR=/tmp/cache/github
                  MINIO_CACHE="pgraph/${MINIO_BUCKET}/enricher-cache/github"
                  GRAPH_URI="https://packagegraph.github.io/graph/enrichment/github"
                  mc alias set pgraph "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

                  if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                    echo "Syncing cache from Minio..."
                    mc mirror --overwrite "${MINIO_CACHE}/" "${CACHE_DIR}/" 2>/dev/null || true
                    echo "Cache warmed: $(find "${CACHE_DIR}" -name '*.json' 2>/dev/null | wc -l) entries"
                  fi

                  # Incremental mode: process bounded batch, append to Fuseki
                  # Unset Minio env vars so pg-collect uses local cache only
                  SAVED_MINIO_ENDPOINT="${MINIO_ENDPOINT}"
                  SAVED_MINIO_BUCKET="${MINIO_BUCKET}"
                  SAVED_MINIO_ACCESS_KEY="${MINIO_ACCESS_KEY}"
                  SAVED_MINIO_SECRET_KEY="${MINIO_SECRET_KEY}"
                  unset MINIO_ENDPOINT MINIO_BUCKET MINIO_ACCESS_KEY MINIO_SECRET_KEY

                  pg-collect enrich-github \
                    --endpoint "$FUSEKI_ENDPOINT" \
                    -o /tmp/enrichment/github.nt \
                    --cache-dir "${CACHE_DIR}" \
                    --max-repos 5000 \
                    --load-graph "$GRAPH_URI"

                  export MINIO_ENDPOINT="${SAVED_MINIO_ENDPOINT}"
                  export MINIO_BUCKET="${SAVED_MINIO_BUCKET}"
                  export MINIO_ACCESS_KEY="${SAVED_MINIO_ACCESS_KEY}"
                  export MINIO_SECRET_KEY="${SAVED_MINIO_SECRET_KEY}"

                  if [ "${ENRICHER_CACHE_DISABLED:-0}" != "1" ]; then
                    echo "Syncing cache to Minio..."
                    mc mirror --overwrite "${CACHE_DIR}/" "${MINIO_CACHE}/" 2>/dev/null || true
                  fi

                  # Export full accumulated graph from Fuseki for QLever parity.
                  # Consistency note: if this export or the subsequent Minio upload
                  # fails, Fuseki will be ahead of QLever until the next successful
                  # run. This is recoverable eventual consistency — no data is lost,
                  # QLever just serves stale GitHub enrichment until the next weekly run.
                  echo "Exporting full GitHub enrichment graph via SPARQL CONSTRUCT..."
                  if ! curl -sf \
                    --data-urlencode "query=CONSTRUCT { ?s ?p ?o } WHERE { GRAPH <${GRAPH_URI}> { ?s ?p ?o } }" \
                    -H "Accept: application/n-triples" \
                    "${FUSEKI_ENDPOINT}/sparql" \
                    -o /tmp/enrichment/github-full.nt; then
                    echo "ERROR: CONSTRUCT export failed"
                    exit 1
                  fi
                  FULL_LINES=$(wc -l < /tmp/enrichment/github-full.nt)
                  FULL_SIZE=$(du -h /tmp/enrichment/github-full.nt | cut -f1)
                  echo "Exported $FULL_LINES triples ($FULL_SIZE)"
                  if [ "$FULL_LINES" -eq 0 ]; then
                    echo "ERROR: CONSTRUCT returned empty graph"
                    exit 1
                  fi
                  /app/scripts/upload-nt.sh /tmp/enrichment/github-full.nt "$GRAPH_URI"
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 4Gi}}
