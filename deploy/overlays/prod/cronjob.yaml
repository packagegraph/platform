apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl-scheduled
  namespace: packagegraph
  labels:
    app: etl
    app.kubernetes.io/name: etl
    app.kubernetes.io/part-of: packagegraph
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: etl
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: minio-credentials
              env:
                - name: HOME
                  value: /tmp
                - name: REPO_URL
                  value: "http://deb.debian.org/debian"
                - name: REPO_TYPE
                  value: "debian"
                - name: COLLECT_ARGS
                  value: "--dist stable --component main"
              resources:
                requests:
                  cpu: "2"
                  memory: 2Gi
                limits:
                  cpu: "4"
                  memory: 4Gi
