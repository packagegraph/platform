apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuseki
  namespace: packagegraph
  labels:
    app: fuseki
    app.kubernetes.io/name: fuseki
    app.kubernetes.io/part-of: packagegraph
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fuseki
  template:
    metadata:
      labels:
        app: fuseki
    spec:
      initContainers:
        - name: load-tdb2
          image: packagegraph/fuseki:latest
          command: ["/fuseki/entrypoint.sh"]
          args: ["--init-only"]
          envFrom:
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: tdb2-data
              mountPath: /data
      containers:
        - name: fuseki
          image: ghcr.io/packagegraph/fuseki:5.3.0
          env:
            - name: JAVA_OPTIONS
              # TDB2 uses memory-mapped files — keep JVM heap low, leave
              # the rest for OS file cache. See:
              # https://github.com/apache/jena/discussions/2099
              # Container limit 4Gi → JVM 1.5Gi + OS cache ~2.5Gi
              value: "-Xmx1536m"
          args:
            - --config
            - /fuseki/config.ttl
            - --port
            - "3030"
          ports:
            - containerPort: 3030
              name: http
          volumeMounts:
            - name: tdb2-data
              mountPath: /data
            - name: fuseki-config
              mountPath: /fuseki/config.ttl
              subPath: config.ttl
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /$/ping
              port: 3030
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /$/ping
              port: 3030
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tdb2-data
          persistentVolumeClaim:
            claimName: fuseki-tdb2
        - name: fuseki-config
          configMap:
            name: fuseki-config
