apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-template
  namespace: packagegraph
  labels:
    app: etl
    app.kubernetes.io/part-of: packagegraph
spec:
  schedule: "0 3 * * 0"  # Weekly Sunday 3am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: etl
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: etl
              image: ghcr.io/packagegraph/etl:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: minio-credentials
              env:
                - name: HOME
                  value: /tmp
                - name: FUSEKI_ENDPOINT
                  value: "http://fuseki.packagegraph.svc:3030/packagegraph"
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
