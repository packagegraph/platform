# GitHub API token for the enrich-github enricher.
#
# Required by: enrich-github CronJob (queries GitHub API for repo metadata,
# language metrics, license, and activity data for packages with GitHub homepages)
#
# Create this secret manually — do NOT commit the actual token:
#
#   KUBECONFIG=~/.kube/config-2 oc create secret generic github-token \
#     -n packagegraph \
#     --from-literal=GITHUB_TOKEN=ghp_YOUR_TOKEN_HERE
#
# Token requirements:
#   - Type: GitHub personal access token (classic) or fine-grained
#   - Scopes needed: public_repo (read-only access to public repositories)
#   - Rate limit: 5,000 requests/hour with token (vs 60/hour without)
#
# The enricher reads GITHUB_TOKEN from the environment via envFrom secretRef.
# Without this secret, the enrich-github CronJob pod will fail to start
# (Kubernetes rejects pods referencing non-existent secrets).
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: packagegraph
type: Opaque
stringData:
  GITHUB_TOKEN: "replace-with-actual-token"
