# Per-instance override for pg-enrich@advisory.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where advisory's own number lives.
#
# Basis: MEASURED on the collection host, 2026-09-25, and it is the one
# that needs watching. 11,572 seconds -- 3.2 hours -- for one successful
# run, against this 8h ceiling. It published correctly: 294,450 RHSA
# triples plus 264,448 DSA triples.
#
# The upstream API is not the cost. RHSA pages at 100 per request over a
# days_back window, and the entire DSA half finished in 0.97 seconds.
# The time goes into enrich_rhsa's resolution loop, which calls
# resolve_package -- a SPARQL query -- once per affected-release package
# per target graph, and target_graphs_for_major_version returns three
# graphs for RHEL 9 and 10 (rhel/N, almalinux/N, rocky/N). On the order
# of 230,000 queries, most returning nothing. See #107.
#
# Two multipliers point the wrong way: adding a fourth RHEL rebuild
# raises the query count by a third, and widening days_back multiplies
# advisories, each of which multiplies queries. The run measured above
# was also a warm one -- the RHSA pages are cached, the resolution
# queries are not, so the cache does not help the expensive part.
#
# The ceiling stays 8h. It is roughly 2.5x the measured run, which is
# less headroom than anything else here has, and lowering it would make
# a slow run fatal rather than visible. Raising it would hide the
# problem. #107 is the fix.
#
# Worth recording how this was missed: the 2026-09-25 screen classified
# it safe by looking for a remote API plus a pacing floor. This loop has
# neither -- the round trips go to our own QLever. One round trip per
# item is O(corpus) regardless of who answers it.

[Service]
TimeoutStartSec=28800
