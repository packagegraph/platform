# Per-instance override for pg-enrich@advisory.service.
#
# The template's TimeoutStartSec is one number shared by eleven enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where advisory's own number lives.
#
# Basis: UNMEASURED. Left at the conservative default. This one ran in
# production against Fuseki before the port, but no runtime from that era
# was recorded here, so there is nothing to size against.

[Service]
TimeoutStartSec=28800
