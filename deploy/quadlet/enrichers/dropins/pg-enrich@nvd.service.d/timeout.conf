# Per-instance override for pg-enrich@nvd.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where nvd's own number lives.
#
# Basis: MEASURED on the collection host, 2026-09-25. 24s for the unit.
#
# Already the bulk pattern that #95/#99/#102 converged on everywhere
# else, and was so before any of that work: ~27 per-year gzipped feeds
# from nvd.nist.gov, each validated against its .meta SHA256 so an
# unchanged feed is served from cache rather than re-downloaded. No
# per-CVE API calls, no NVD_API_KEY needed.
#
# Cost tracks NVD's dataset, not ours.

[Service]
TimeoutStartSec=28800
