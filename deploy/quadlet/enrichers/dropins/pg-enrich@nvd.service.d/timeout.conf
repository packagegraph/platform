# Per-instance override for pg-enrich@nvd.service.
#
# The template's TimeoutStartSec is one number shared by eleven enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where nvd's own number lives.
#
# Basis: UNMEASURED. NVD's API is rate-limited per key and the enricher is
# network-bound against it. A timeout below the real runtime is how koji
# and security were lost, so this stays at the conservative default until
# a run measures it. Daily cadence, so eight hours has room.

[Service]
TimeoutStartSec=28800
