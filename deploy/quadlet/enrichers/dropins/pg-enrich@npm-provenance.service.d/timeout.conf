# Per-instance override for pg-enrich@npm-provenance.service.
#
# The template's TimeoutStartSec is one number shared by eleven enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where npm-provenance's own number lives.
#
# Basis: MEASURED workload, 2026-09-25, not yet a measured runtime. The
# corpus holds 1,805 NpmPackage nodes, and this enricher issues one
# registry.npmjs.org attestations request per package version. That host
# is not in http_transport.rs's slow list, so it paces at the 200ms
# default: roughly 6 minutes of request time for a full pass.
#
# Worth knowing that this has the shape that broke three other enrichers
# under #59 -- one remote request per corpus member, so the cost is
# O(our corpus) and grows as collection improves. It is fine today only
# because the npm corpus is small. The 8h ceiling is reached at about
# 144,000 package versions (144,000 x 0.2s), and npm upstream has orders
# of magnitude more than that, so a serious npm collection would break
# this enricher rather than merely slow it.
#
# Unlike OSV (archives), Koji (system.multicall) and Repology (dumps),
# there is no known bulk form of npm's attestations endpoint -- it is
# per package-version by design. So the answer if that threshold is ever
# approached is scoping or checkpointed incremental work, not a batch
# API. Re-measure before growing the npm corpus, not after.

[Service]
TimeoutStartSec=28800
