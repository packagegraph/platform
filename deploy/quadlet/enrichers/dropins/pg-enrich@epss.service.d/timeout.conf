# Per-instance override for pg-enrich@epss.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where epss's own number lives.
#
# Basis: MEASURED on the collection host, 2026-09-25. 13s for the unit,
# 8.73s of enricher work, 85,752 of 86,732 CVE entities matched,
# 428,760 triples.
#
# Worth recording that this is 9.5x its previously documented run, which
# matched 9,026 CVEs. Nothing about the enricher changed; the corpus did.
# The bulk OSV collector now covers 17 ecosystems (#95, #102), so there
# are far more CVE entities in the graph for EPSS to join against.
#
# Cost is bounded by EPSS's own dataset, fetched 10k per request, not by
# our corpus -- the join happens in memory against one bulk download.

[Service]
TimeoutStartSec=28800
