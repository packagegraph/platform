# Per-instance override for pg-enrich@revdeps.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where revdeps's own number lives.
#
# Basis: MEASURED on the collection host, 2026-09-25. 17s for the unit.
#
# Pure SPARQL aggregation -- it issues no HTTP requests at all, so there
# is no pacing floor and no upstream to be slow. The whole cost is one
# COUNT(DISTINCT) grouped query against QLever.
#
# Store-side and corpus-sized, so this will grow with collection, but
# from 17s there is a great deal of room.

[Service]
TimeoutStartSec=28800
