# Per-instance override for pg-enrich@security.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where security's own number lives.
#
# Basis: MEASURED on the collection host, 2026-09-25. One full run:
# 19.77s of enricher work, 23s wall clock for the whole unit, 101,392
# triples published, 373.9M peak RSS against the shared 8g cap.
#
#   Debian   69,010 corpus names   68.64 MB / 68,454 entries   87,531 links
#   Alpine   29,559 corpus names    3.81 MB /  4,665 entries   13,861 links
#
# The corpus-index query (query_identities_by_type_under) was the part no
# stub could exercise honestly. It answered in ~2s for Debian and under a
# second for Alpine, so it is not the cost centre the rewrite risked
# creating.
#
# One hour is ~156x the measured run, which is far more headroom than the
# number needs. It stays anyway: this is a single run on an idle host with
# a warm archive fetch (68 MB in 2s), the corpus grows, and the cost of
# being wrong downward is a SIGKILL mid-run with nothing published -- which
# is exactly how this enricher spent 2026-09-14 to 2026-09-25. The timeout
# exists to catch a hang, not to bound a known-good run tightly.
#
# For contrast, the run this replaced: 8 hours of wall clock to reach
# 44,900 of ~314,000 packages, 1min 40s of CPU in all of it, then killed.
# The old 4h here was sized for that OSV API path (#99 deleted it) and was
# wrong even for it -- the real figure was ~56-63h.

[Service]
TimeoutStartSec=3600
