# Per-instance override for pg-enrich@security.service.
#
# The template's TimeoutStartSec is one number shared by eleven enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where security's own number lives.
#
# Basis: ESTIMATED from the redesign, not measured. The 8h kill was the
# old shape -- one OSV request per package VERSION, eleven ecosystems
# sequentially. It now asks in batches of 1000 distinct NAMES and fetches
# each distinct advisory once, so the request count is bounded by the
# number of advisories rather than the size of the corpus. Four hours is
# far above what that should need and far below the eight it could not
# finish in; revise once a real run exists.

[Service]
TimeoutStartSec=14400
