# Per-instance override for pg-enrich@security.service.
#
# The template's TimeoutStartSec is one number shared by eleven enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where security's own number lives.
#
# Basis: ESTIMATED from measurement of its parts. The enricher no longer
# calls the OSV API at all -- it reads the Debian and Alpine archives the
# bulk collector already publishes and joins them against the corpus.
# Measured locally: 108s to download and walk both archives (Debian 99.2s,
# Alpine 8.6s). The join adds one SPARQL query per distro over the
# collected package names, which is unmeasured.
#
# One hour is roughly thirty times the measured archive cost, which leaves
# room for the queries and for the corpus growing, while being short
# enough that a hang is visible the same hour. The old 4h was sized for an
# API path that no longer exists -- and was wrong even for that, since the
# real figure was ~63h.

[Service]
TimeoutStartSec=3600
