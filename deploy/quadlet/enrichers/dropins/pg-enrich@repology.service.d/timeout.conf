# Per-instance override for pg-enrich@repology.service.
#
# The template's TimeoutStartSec is one number shared by eleven enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where repology's own number lives.
#
# Basis: MEASURED, and deliberately unchanged. At Repology's observed rate
# (~100 packages / 1.7min against 314,416) a complete pass needs ~90 hours.
# No timeout here can be "enough", and that is by design: every run's value
# is the cache progress it leaves for the next one, flushed to Minio every
# five minutes. The eight hours is simply how much progress one weekly run
# is allowed to make.
#
# It follows that this unit is EXPECTED to end in a timeout kill every
# week, which is why the notifier is switched off for it below. A failure
# report that fires every week on healthy behaviour trains the reader to
# ignore failure reports.

[Unit]
OnFailure=

[Service]
TimeoutStartSec=28800
