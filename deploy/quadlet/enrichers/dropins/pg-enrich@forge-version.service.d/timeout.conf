# Per-instance override for pg-enrich@forge-version.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where forge-version's own number lives.
#
# Basis: MEASURED on the collection host, 2026-09-25. 5s for the unit,
# 2.05s of enricher work, 14 triples from 2 of 18 forge instances.
#
# The 2-of-18 is the known GITLAB_TOKEN gap, not a failure: without
# credentials it can only reach github.com, gitlab.com and Bitbucket
# Cloud. Provisioning a token widens coverage and will raise this number,
# but 18 probes cannot approach any plausible ceiling.
#
# Bounded by the number of forges we track, which is a hand-maintained
# list, so this does not grow with the corpus.

[Service]
TimeoutStartSec=28800
