# Per-instance override for pg-enrich@taxonomy.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where taxonomy's own number lives.
#
# Basis: MEASURED on the collection host, 2026-09-25, after #92 replaced
# the materialise-everything walk with keyset paging at 50k. One full run:
# 312.30s of enricher work, 319s wall clock, 882,485 of 2,737,687
# identities classified, 1,244,428 triples, 373.2M peak RSS.
#
# The memory number is the one that matters here: this enricher used to be
# OOM-killed at a 4g cap in 29 seconds. It now finishes using under 5% of
# the shared 8g cap, because it streams pages instead of materialising
# every PackageIdentity into one Vec.
#
# The paged walk was verified complete against the store rather than
# assumed -- a direct COUNT over the same WHERE clause returns exactly
# 2,737,687, so the keyset FILTER(STR(?identity) > ...) against
# ORDER BY ?identity is not skipping ranges. Worth re-checking if that
# query ever changes; a keyset walk that silently short-changes looks
# exactly like a fast, successful run.
#
# An hour is ~11x the measured run. That is the right order of headroom
# for something corpus-sized and growing, so it stays. The previous
# "72s" basis predated #92 and is not comparable -- it described the run
# shape that OOMed.

[Service]
TimeoutStartSec=3600
