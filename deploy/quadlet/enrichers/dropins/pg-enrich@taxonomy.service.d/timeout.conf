# Per-instance override for pg-enrich@taxonomy.service.
#
# The template's TimeoutStartSec is one number shared by eleven enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where taxonomy's own number lives.
#
# Basis: MEASURED. pg-enrich@.container records a 2026-09-15 run at 72s
# (2.55 GiB peak under a deliberately generous cap). The enricher now pages
# the corpus instead of materialising it, which trades a little wall-clock
# for bounded memory, so this is the measured minute with a fifty-fold
# margin -- generous against corpus growth, and still short enough that a
# hang is visible the same hour rather than the next working day.

[Service]
TimeoutStartSec=3600
