# Per-instance override for pg-enrich@blast-radius.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where blast-radius's own number lives.
#
# Basis: UNMEASURED, and deliberately not yet run.
#
# It reads met:reverseDependencyCount via a live QLever query rather than
# from Minio, so it only sees what enrich-revdeps published AFTER the
# next nightly rebuild (03:30 UTC) has indexed it. Running it in the same
# window as revdeps produces a confirmed-empty graph -- that already
# happened once, see README "Enrichers".
#
# revdeps was measured at 17s on 2026-09-25 and is pure SPARQL
# aggregation; this one has the same shape and no network I/O, so it is
# very unlikely to need anything near the ceiling. Measure it the day
# after a revdeps run, not the same day.

[Service]
TimeoutStartSec=28800
