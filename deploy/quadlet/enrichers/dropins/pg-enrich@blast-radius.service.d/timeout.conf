# Per-instance override for pg-enrich@blast-radius.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where blast-radius's own number lives.
#
# Basis: MEASURED on the collection host, 2026-09-25. 8s for the unit,
# 0.26s of enricher work, 1,848 triples.
#
# Pure SPARQL, no network I/O -- it reads vulnerabilities that have both
# a CVSS score and a reverse-dependency count and writes one
# sec:blastRadius per match. Nothing here can approach the ceiling.
#
# Scheduling, not runtime, is this one's hazard. It reads
# met:reverseDependencyCount through a live QLever query rather than
# from Minio, so it only sees what enrich-revdeps published AFTER a
# rebuild has indexed it. Running it in the same window as revdeps
# yields a confirmed-empty graph, which has happened once already
# (README, "Enrichers"). The timer sits on Tuesday for that reason.
#
# The 1,848 is worth keeping an eye on. At the time of measurement the
# corpus held 95,433 vulnerabilities with a cveId and 902,727
# reverseDependencyCount triples, so a match rate under 2% is either
# sparse CVSS coverage or a join that is narrower than intended. Not
# investigated. A run that returns a much larger number later is
# probably coverage improving, not a regression.
[Service]
TimeoutStartSec=28800
