# Per-instance override for pg-enrich@koji.service.
#
# The template's TimeoutStartSec is one number shared by eleven enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where koji's own number lives.
#
# Basis: UNMEASURED since the change; deliberately unchanged. The 8h kill
# happened with the enricher asking Fedora's hub about every RHEL,
# AlmaLinux, Rocky and openSUSE RPM in the corpus and never caching a "no
# such build". Both are fixed, but the remaining work is still one
# XML-RPC round trip per NVR against someone else's rate limits, so the
# conservative number stays until a run measures it.

[Service]
TimeoutStartSec=28800
