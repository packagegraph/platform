# Per-instance override for pg-enrich@koji.service.
#
# The template's TimeoutStartSec is one number shared by ten enrichers
# whose workloads have nothing in common -- the same mistake that let koji
# and security be SIGKILL'd mid-run while taxonomy, which finishes in
# about a minute, would have sat undetected for eight hours if it hung
# (#59). This file is where koji's own number lives.
#
# Basis: MEASURED workload, and it does not fit. Against the production
# endpoint on 2026-09-25, `--distro fedora` resolves to 7 graphs,
# 556,785 BinaryRPM rows and 363,822 distinct NVRs. enrich_koji.rs makes
# one getBuild XML-RPC call per NVR, and http_transport.rs paces
# koji.fedoraproject.org at 500ms, so one complete pass is
#
#   363,822 x 0.5s = 181,911s = 50.5 hours
#
# against this 8 hour ceiling. No value here fixes that -- a weekly unit
# cannot run for two days, and raising the number only moves the SIGKILL
# later. The ceiling stays 8h because it is the shared default and this
# file should not imply the problem is tuning. See #104.
#
# The fix is batching, not a timeout: the hub implements
# system.multicall (verified live, two getBuild calls in one request),
# which at 1,000 NVRs per call is 364 requests and roughly 3 minutes.
#
# Ruled out while measuring, so it is not re-treaded: #62's capability
# stubs cannot reach this enricher. The discovery query joins BinaryRPM
# through hasVersion/versionString and stubs have no version -- zero
# BinaryRPM nodes in the fedora graphs have a parenthesised name.

[Service]
TimeoutStartSec=28800
