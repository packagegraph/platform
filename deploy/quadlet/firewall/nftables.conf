#!/usr/sbin/nft -f
# Baseline packet filter for the QLever quadlet host. Loaded by the native
# nftables.service (NOT a quadlet/container -- packet filtering belongs to
# the kernel, and there's no isolation benefit to containerizing it).
#
# Uses a separate table ("inet filter") from Podman's own "inet netavark"
# table (container NAT/isolation plumbing) so this ruleset can be reloaded
# independently without touching container networking.
#
# banned_ips / banned_ips6 are shared enforcement points: fail2ban and/or
# CrowdSec add/remove elements here (via their nftables actions/bouncer),
# so `nft list set inet filter banned_ips` shows every ban regardless of
# which tool made it. A 24h set-level timeout is a safety net in case a
# tool fails to unban -- entries expire either way.
#
# All matching here is either a named-set hash lookup or a simple counter
# comparison (`ct state`, `limit rate`) -- no per-packet userspace work,
# so this stays cheap even under load or with thousands of banned IPs.

table inet filter {
    set banned_ips {
        type ipv4_addr
        flags interval, timeout
        timeout 24h
    }

    set banned_ips6 {
        type ipv6_addr
        flags interval, timeout
        timeout 24h
    }

    # Sources that always bypass the rate limits below (but NOT the
    # banned_ips check above -- an explicit ban still wins). Populated and
    # kept current by sync-trusted-ips.sh/.timer, since this tracks a
    # dynamic-DNS name whose IP changes over time -- a hardcoded rule here
    # would silently go stale. Empty by default; not a security boundary
    # by itself, just removes the coarse connection-rate pre-filter for a
    # known-trusted source.
    set trusted_ips {
        type ipv4_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state invalid drop

        ip saddr @banned_ips drop
        ip6 saddr @banned_ips6 drop

        ct state established,related accept

        ip saddr @trusted_ips accept

        icmp type { echo-request, destination-unreachable, time-exceeded } accept
        icmpv6 type { echo-request, destination-unreachable, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept

        # New-connection rate limits are a coarse pre-filter against
        # floods, not the actual abuse-detection layer -- that's
        # fail2ban/CrowdSec, which ban on auth failures / request
        # patterns, not raw connection rate. Sized generously so no
        # legitimate single connection (or reasonably heavy automation)
        # is ever affected; a sustained brute-force flood is not.
        tcp dport 22 ct state new limit rate 60/minute burst 20 packets accept
        tcp dport { 80, 443 } ct state new limit rate 200/second burst 400 packets accept

        # Rate-limited logging so a port scan can be analyzed without
        # flooding the journal, then drop (the chain's default policy
        # would drop anyway -- this just makes dropped traffic visible).
        limit rate 10/minute log prefix "nft-input-drop: " drop
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
