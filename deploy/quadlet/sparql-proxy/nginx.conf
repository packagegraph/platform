# Replace sparql.example.com (both occurrences below) with your actual
# domain before deploying -- DNS must already point at the host, and
# nginx will refuse to start until a matching certificate exists at
# /etc/letsencrypt/live/<your-domain>/ (see README.md's bootstrap steps).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Sized for throughput, not the conservative 2r/s used by the
    # basic-auth-gated Fuseki proxy (deploy/base/sparql-proxy) -- this
    # endpoint is meant for high-volume read access. Tune as real load
    # data comes in.
    limit_req_zone $binary_remote_addr zone=sparql:10m rate=50r/s;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent" ${request_time}s';
    access_log /dev/stdout main;

    # SPARQL JSON results compress well and this is a read-heavy endpoint.
    gzip on;
    gzip_types application/sparql-results+json application/json;
    gzip_min_length 512;
    gzip_comp_level 5;

    upstream qlever {
        server 127.0.0.1:7001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name sparql.example.com;

        # ACME HTTP-01 challenge -- must stay reachable over plain HTTP.
        location /.well-known/acme-challenge/ {
            root /var/www/acme-challenge;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name sparql.example.com;

        ssl_certificate     /etc/letsencrypt/live/sparql.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sparql.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 1m;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;

        # Large SPARQL JSON results shouldn't spill to disk for typical
        # query sizes -- raise the in-memory buffer before nginx falls
        # back to temp files.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        add_header X-Content-Type-Options nosniff always;

        # Defense in depth: QLever itself unconditionally rejects SPARQL
        # Update without a valid access-token (verified: HTTP 403 with no
        # token supplied), and this proxy never has or forwards the real
        # token, so a client can never supply a working one. This rule
        # only guards against someone trying anyway with a guessed/stale
        # token in the query string -- it does not inspect POST bodies,
        # which is why QLever's own unconditional token check is the
        # actual guarantee, not this rule.
        if ($arg_access_token) {
            return 403;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/acme-challenge;
        }

        location / {
            limit_req zone=sparql burst=100 nodelay;
            limit_except GET POST {
                deny all;
            }

            proxy_pass http://qlever;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
