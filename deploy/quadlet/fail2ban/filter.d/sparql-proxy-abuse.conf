[Definition]
# Matches deploy/quadlet/sparql-proxy/nginx.conf's log_format:
#   $remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" ${request_time}s
# Any 4xx response counts -- includes the access-token defense-in-depth
# rejection (403) and normal not-found/bad-request noise from scanning,
# neither of which a legitimate SPARQL client should ever produce
# repeatedly against a single, simple endpoint.
failregex = ^<HOST> -.*"(GET|POST) \S+ HTTP/\d\.\d" 4\d\d
ignoreregex =
