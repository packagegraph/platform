[Definition]
# Custom action targeting the shared banned_ips/banned_ips6 nftables sets
# (see firewall/nftables.conf and nft-shared-ban.sh) instead of fail2ban's
# default nftables action, which would manage its own separate chain.
actionstart =
actionstop =
actioncheck =
actionban = /etc/fail2ban/nft-shared-ban.sh ban <ip> <bantime>
actionunban = /etc/fail2ban/nft-shared-ban.sh unban <ip>
