name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl/pg-collect
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl/pg-collect
      - run: cargo test --all-targets --locked --quiet
      # `pg-collect debian` names the repository FORMAT; its default
      # distribution is debian regardless of what the Release file says, so
      # the Ubuntu entry points have to pass --distro ubuntu explicitly or
      # they mint Debian-namespaced identities for Ubuntu data (#71). This
      # runs all six real entry points against a local repository fixture.
      # Invoked directly, not via `unittest discover` (#57).
      - name: Ubuntu entry points must emit Ubuntu identities and PURLs
        run: |
          python3 -m pip install PyYAML==6.0.3
          PG_COLLECT_BIN="$PWD/target/debug/pg-collect" \
            python3 ../../deploy/quadlet/collectors/tests/test_ubuntu_identity.py -v
      - name: Mutation-check the wrapper lifecycle
        run: |
          PG_COLLECT_BIN="$PWD/target/debug/pg-collect" \
            python3 ../../deploy/quadlet/collectors/tests/checkpoint_mutations.py

  # The rpm-full binary enables checkpointing; the wrappers are what retire a
  # generation and keep checkpoints out of Minio. Enabling one without the
  # other leaves a generation active forever, replaying its fragments across
  # every later scheduled run. These gates validate repository artifacts, NOT
  # the separately installed host scripts. The coordinated, pinned deployment
  # is documented in deploy/quadlet/collectors/checkpoint-cutover.md.
  test-wrapper-checkpoint-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/quadlet/collectors/scripts/test-wrapper-checkpoint-contract.sh
      - run: python3 -m unittest discover -s deploy/quadlet/collectors/tests -p test_checkpoint_release.py
      # Every collector and enricher publishes through upload-nt.sh, and an
      # upload replaces the whole named graph. This runs the real script to
      # prove it refuses a graph with no data rather than erasing the live one.
      - name: Upload floor must refuse an empty graph
        # Invoked directly rather than via `unittest discover`, which exits 0
        # when it matches nothing -- a rename would leave this step green
        # while testing nothing. Same reasoning as the step below.
        run: python3 deploy/quadlet/collectors/tests/test_upload_floor.py -v
      - name: Gate the QLever rebuild's graph identity comparison
        # Invoked directly, not via `unittest discover`: discover exits 0 when
        # it finds nothing, so a renamed or moved file would turn this step
        # into a vacuous pass -- the exact failure mode tracked in #57.
        run: python3 deploy/quadlet/tests/test_rebuild_index_gate.py -v
      # A rebuild that fails must stay retryable, and must not have eaten the
      # inputs the retry needs. Drives the real script against a fake object
      # store with conversion, build, gate and promotion failures injected.
      # Directly invoked for the same reason as the step above.
      - name: Rebuild failures must stay retryable and preserve their inputs
        run: python3 deploy/quadlet/tests/test_rebuild_retry_and_preservation.py -v
      # The collector scratch volume is shared by every concurrently running
      # instance, so a fixed path under /tmp is a shared mailbox. The static
      # check covers every wrapper; the concurrency check runs two real ones
      # against a barrier and inspects what each actually publishes. Directly
      # invoked, for the reason given above.
      - name: Collector wrappers must isolate their scratch
        run: python3 deploy/quadlet/collectors/tests/test_collector_run_dirs.py -v
      - name: Concurrent collectors must not publish each other's bytes
        run: python3 deploy/quadlet/collectors/tests/test_collector_concurrency.py -v
      # An ecosystem name OSV does not publish is invisible: the old security
      # enricher asked for `deb`, `apk`, `rpm` and `fedora` for months and got
      # HTTP 400 every time (#97). Checks the OSV job's list statically, both
      # for the RPM-side ecosystems that do exist and against the four that
      # never did. Directly invoked, for the reason given above.
      - name: The OSV job must ask for ecosystems OSV publishes
        run: python3 deploy/quadlet/collectors/tests/test_osv_ecosystems.py -v
      # Whether to reload qlever must follow promoted-vs-serving state, not a
      # best-effort status report that a promoting run can die before writing
      # (#73). Drives the real host script against fake podman/systemctl/curl,
      # and statically checks that the unit still invokes it on the failure
      # path. Directly invoked, for the reason given above.
      - name: QLever refresh must follow state, not run status
        run: python3 deploy/quadlet/tests/test_qlever_refresh.py -v
      # Publishing a graph must commit through a manifest, not by overwriting
      # a stable key and rewriting a sidecar that was already there -- that
      # "commit marker" only ever gated a graph's first upload (#72). These
      # three cover the two writers, the host reader, and the four Kubernetes
      # readers that must apply identical rules. Directly invoked, for the
      # reason given above.
      - name: Publishing a graph must commit through a manifest
        run: python3 deploy/quadlet/collectors/tests/test_upload_manifest.py -v
      - name: The index must be built from one verified generation per graph
        run: python3 deploy/quadlet/tests/test_graph_manifest.py -v
      - name: Every corpus reader must apply the same rules
        run: python3 deploy/quadlet/tests/test_reader_parity.py -v
      # Three enrichers and a collector failed for days with nothing
      # reporting it (#59). Drives the real unit-failed.sh against fake
      # systemctl/journalctl/logger, and statically checks that every
      # template still names the notifier and every enricher still has a
      # timeout with a stated basis. Directly invoked, for the reason given
      # above.
      - name: A failed unit must report itself somewhere a human looks
        run: python3 deploy/quadlet/tests/test_unit_failure_notifier.py -v
      # The units above only help once they are on the host, and a partial
      # install is worse than none. Runs the real host-sync.sh against a
      # throwaway tree via PG_SYNC_ROOT. Directly invoked, same reason.
      - name: The host sync must apply the whole delta, and not write through
        run: python3 deploy/quadlet/tests/test_host_sync.py -v
      - name: Verify exclusion with the image's pinned mc
        run: |
          set -euo pipefail
          mc_version=$(sed -n 's/^ARG MC_VERSION=//p' etl/Containerfile)
          test -n "$mc_version"
          mc_test_dir=$(mktemp -d)
          asset="mc.linux-amd64.${mc_version}"
          base="https://github.com/minio/mc/releases/download/${mc_version}"
          curl -fsSL "$base/$asset" -o "$mc_test_dir/$asset"
          curl -fsSL "$base/$asset.sha256sum" -o "$mc_test_dir/checksum"
          expected_sha=$(awk '{print $1}' "$mc_test_dir/checksum")
          printf '%s  %s\n' "$expected_sha" "$mc_test_dir/$asset" | sha256sum -c -
          chmod +x "$mc_test_dir/$asset"
          python3 deploy/quadlet/collectors/tests/check_mc_exclusion.py "$mc_test_dir/$asset"

  build-etl:
    runs-on: ubuntu-latest
    needs: [test-rust, test-wrapper-checkpoint-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Sync ontology files for container build
        run: |
          set -euo pipefail
          # Single source of truth -- see etl/ONTOLOGY_VERSION. Validation
          # here must use the same pin the published images use, or a PR can
          # go green against an ontology version that never ships.
          ref="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' etl/ONTOLOGY_VERSION | grep -m1 . || true)"
          if [ -z "${ref}" ]; then
            echo "etl/ONTOLOGY_VERSION contains no version value" >&2
            exit 1
          fi
          echo "ontology ref: ${ref}"
          # Fetch supports both release tags and immutable commit pins.
          git init /tmp/ontology
          git -C /tmp/ontology remote add origin https://github.com/packagegraph/ontology.git
          git -C /tmp/ontology fetch --depth 1 origin "${ref}"
          git -C /tmp/ontology checkout --detach FETCH_HEAD
          bash etl/scripts/sync-ontology.sh /tmp/ontology
      - uses: docker/setup-buildx-action@v3
      - name: Build ETL image
        uses: docker/build-push-action@v6
        with:
          context: etl
          file: etl/Containerfile
          push: false
          tags: ghcr.io/packagegraph/etl:ci

  build-fuseki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Fuseki image
        uses: docker/build-push-action@v6
        with:
          context: fuseki
          file: fuseki/Containerfile
          push: false
          tags: ghcr.io/packagegraph/fuseki:ci

  build-qlever-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build QLever rebuild image
        uses: docker/build-push-action@v6
        with:
          context: etl
          file: etl/Containerfile.qlever-rebuild
          push: false
          tags: ghcr.io/packagegraph/qlever-rebuild:ci

  # Merges to main publish the floating `devel-latest` tag -- which is what
  # the deployed host's AutoUpdate=registry units track -- plus an immutable
  # `main-<sha>` to roll back to. Production `latest` is deliberately NOT
  # published here; it moves only on a cut release, via release.yml.
  #
  # The jobs above stay amd64-only and push nothing, so pull-request latency
  # is unchanged: the arm64 build only runs once a change is on main.
  #
  # The `github.ref` guard also keeps this from firing when release.yml
  # calls this workflow, where the ref is a tag rather than refs/heads/main.
  publish-devel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-rust, build-etl, build-fuseki, build-qlever-rebuild]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      tags: |
        devel-latest
        main-${{ github.sha }}
