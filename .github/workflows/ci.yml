name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Validate ontology TTL files
        run: |
          for f in etl/ontology/*.ttl; do
            echo "Checking $f..."
            uv run --with rdflib python -c "import rdflib; g = rdflib.Graph(); g.parse('$f', format='turtle'); print(f'  OK: {len(g)} triples')"
          done

  test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl/pg-collect
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl/pg-collect
      - run: cargo test --quiet -- --skip test_collect_with_writer_single_arch

  build-etl:
    runs-on: ubuntu-latest
    needs: [test-rust]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ETL image
        uses: docker/build-push-action@v6
        with:
          context: etl
          file: etl/Containerfile
          push: false
          tags: ghcr.io/packagegraph/etl:ci

  build-fuseki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Fuseki image
        uses: docker/build-push-action@v6
        with:
          context: fuseki
          file: fuseki/Containerfile
          push: false
          tags: ghcr.io/packagegraph/fuseki:ci
