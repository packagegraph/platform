name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl/pg-collect
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl/pg-collect
      - run: cargo test --all-targets --locked --quiet
      - name: Mutation-check the wrapper lifecycle
        run: |
          PG_COLLECT_BIN="$PWD/target/debug/pg-collect" \
            python3 ../../deploy/quadlet/collectors/tests/checkpoint_mutations.py

  # The rpm-full binary enables checkpointing; the wrappers are what retire a
  # generation and keep checkpoints out of Minio. Enabling one without the
  # other leaves a generation active forever, replaying its fragments across
  # every later scheduled run. These gates validate repository artifacts, NOT
  # the separately installed host scripts. The coordinated, pinned deployment
  # is documented in deploy/quadlet/collectors/checkpoint-cutover.md.
  test-wrapper-checkpoint-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/quadlet/collectors/scripts/test-wrapper-checkpoint-contract.sh
      - run: python3 -m unittest discover -s deploy/quadlet/collectors/tests -p test_checkpoint_release.py
      - name: Gate the QLever rebuild's graph identity comparison
        # Invoked directly, not via `unittest discover`: discover exits 0 when
        # it finds nothing, so a renamed or moved file would turn this step
        # into a vacuous pass -- the exact failure mode tracked in #57.
        run: python3 deploy/quadlet/tests/test_rebuild_index_gate.py -v
      - name: Verify exclusion with the image's pinned mc
        run: |
          set -euo pipefail
          mc_version=$(sed -n 's/^ARG MC_VERSION=//p' etl/Containerfile)
          test -n "$mc_version"
          mc_test_dir=$(mktemp -d)
          asset="mc.linux-amd64.${mc_version}"
          base="https://github.com/minio/mc/releases/download/${mc_version}"
          curl -fsSL "$base/$asset" -o "$mc_test_dir/$asset"
          curl -fsSL "$base/$asset.sha256sum" -o "$mc_test_dir/checksum"
          expected_sha=$(awk '{print $1}' "$mc_test_dir/checksum")
          printf '%s  %s\n' "$expected_sha" "$mc_test_dir/$asset" | sha256sum -c -
          chmod +x "$mc_test_dir/$asset"
          python3 deploy/quadlet/collectors/tests/check_mc_exclusion.py "$mc_test_dir/$asset"

  build-etl:
    runs-on: ubuntu-latest
    needs: [test-rust, test-wrapper-checkpoint-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Sync ontology files for container build
        run: |
          set -euo pipefail
          # Single source of truth -- see etl/ONTOLOGY_VERSION. Validation
          # here must use the same pin the published images use, or a PR can
          # go green against an ontology version that never ships.
          ref="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' etl/ONTOLOGY_VERSION | grep -m1 . || true)"
          if [ -z "${ref}" ]; then
            echo "etl/ONTOLOGY_VERSION contains no version value" >&2
            exit 1
          fi
          echo "ontology ref: ${ref}"
          git clone --depth 1 --branch "${ref}" https://github.com/packagegraph/ontology.git /tmp/ontology
          bash etl/scripts/sync-ontology.sh /tmp/ontology
      - uses: docker/setup-buildx-action@v3
      - name: Build ETL image
        uses: docker/build-push-action@v6
        with:
          context: etl
          file: etl/Containerfile
          push: false
          tags: ghcr.io/packagegraph/etl:ci

  build-fuseki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Fuseki image
        uses: docker/build-push-action@v6
        with:
          context: fuseki
          file: fuseki/Containerfile
          push: false
          tags: ghcr.io/packagegraph/fuseki:ci

  build-qlever-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build QLever rebuild image
        uses: docker/build-push-action@v6
        with:
          context: etl
          file: etl/Containerfile.qlever-rebuild
          push: false
          tags: ghcr.io/packagegraph/qlever-rebuild:ci

  # Merges to main publish the floating `devel-latest` tag -- which is what
  # the deployed host's AutoUpdate=registry units track -- plus an immutable
  # `main-<sha>` to roll back to. Production `latest` is deliberately NOT
  # published here; it moves only on a cut release, via release.yml.
  #
  # The jobs above stay amd64-only and push nothing, so pull-request latency
  # is unchanged: the arm64 build only runs once a change is on main.
  #
  # The `github.ref` guard also keeps this from firing when release.yml
  # calls this workflow, where the ref is a tag rather than refs/heads/main.
  publish-devel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-rust, build-etl, build-fuseki, build-qlever-rebuild]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      tags: |
        devel-latest
        main-${{ github.sha }}
