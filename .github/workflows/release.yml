name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Cutting a v* tag is the only thing that moves production `latest`.
  # Merges to main publish `devel-latest` instead (see ci.yml).
  publish:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      tags: |
        ${{ github.ref_name }}
        latest
      # Historical behaviour, preserved deliberately: the ontology repo is
      # cloned at the *platform* tag, so a platform release requires an
      # identically named ontology tag to exist. ci.yml pins v0.13.0
      # instead. Reconciling the two is a separate change.
      ontology_ref: ${{ github.ref_name }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
