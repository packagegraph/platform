name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Sync ontology files for container build
        run: |
          git clone --depth 1 --branch ${{ steps.version.outputs.tag }} https://github.com/packagegraph/ontology.git /tmp/ontology
          bash etl/scripts/sync-ontology.sh /tmp/ontology

      - name: Build and push ETL image
        uses: docker/build-push-action@v6
        with:
          context: etl
          file: etl/Containerfile
          push: true
          tags: |
            ghcr.io/packagegraph/etl:${{ steps.version.outputs.tag }}
            ghcr.io/packagegraph/etl:latest

      - name: Build and push Fuseki image
        uses: docker/build-push-action@v6
        with:
          context: fuseki
          file: fuseki/Containerfile
          push: true
          tags: |
            ghcr.io/packagegraph/fuseki:${{ steps.version.outputs.tag }}
            ghcr.io/packagegraph/fuseki:latest

      - name: Build and push QLever rebuild image
        uses: docker/build-push-action@v6
        with:
          context: etl
          file: etl/Containerfile.qlever-rebuild
          push: true
          tags: |
            ghcr.io/packagegraph/qlever-rebuild:${{ steps.version.outputs.tag }}
            ghcr.io/packagegraph/qlever-rebuild:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
