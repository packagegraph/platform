[package]
name = "pg-collect"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pg-collect"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json"] }
flate2 = "1.0"
quick-xml = "0.36"
rayon = "1.10"
percent-encoding = "2.3"
zstd = "0.13"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
x509-parser = "0.16"
tar = "0.4"
walkdir = "2.5"
once_cell = "1.20"
zip = "2"
xz2 = "0.1"
brotli = "7"
unicode-normalization = "0.1"
toml = "0.8"
glob = "0.3"
libc = "0.2"

[dev-dependencies]
mockito = "1.6"
tempfile = "3.15"
