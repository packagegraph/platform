[package]
name = "pg-collect"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pg-collect"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
flate2 = "1.0"
quick-xml = "0.36"
rayon = "1.10"
percent-encoding = "2.3"
zstd = "0.13"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
walkdir = "2.5"
once_cell = "1.20"
zip = "2"
xz2 = "0.1"

[dev-dependencies]
mockito = "1.6"
tempfile = "3.15"
